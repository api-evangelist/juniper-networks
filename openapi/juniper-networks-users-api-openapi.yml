openapi: 3.2.0
info:
  title: Juniper Networks Junos Space Network Management Platform REST Users API
  description: RESTful API for Junos Space Network Management Platform. Junos Space provides centralized management for Juniper Networks devices including routers, switches, and security appliances. The REST API enables programmatic access to device management, configuration deployment, script execution, and network monitoring. The API uses HTTP Basic or certificate-based authentication and returns XML or JSON responses based on the Accept header. API resources follow HATEOAS principles with discoverable URIs and link relations.
  version: '24.1'
  contact:
    name: Juniper Networks Support
    url: https://www.juniper.net/documentation/product/us/en/junos-space-network-management-platform/
  license:
    name: Proprietary
    url: https://www.juniper.net/us/en/legal-notices.html
servers:
- url: https://{space_server}/api/space
  description: Junos Space Platform API endpoint.
  variables:
    space_server:
      description: Hostname or IP address of the Junos Space server.
      default: space.example.com
security:
- basicAuth: []
tags:
- name: Users
  description: User and role-based access control management.
paths:
  /user-management/users:
    get:
      operationId: listUsers
      summary: Juniper Networks List users
      description: Returns all user accounts configured in Junos Space, including role assignments and domain access.
      tags:
      - Users
      responses:
        '200':
          description: Users returned.
          content:
            application/vnd.net.juniper.space.user-management.users+json;version=1:
              schema:
                type: object
                properties:
                  users:
                    type: object
                    properties:
                      user:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  responses:
    Unauthorized:
      description: Authentication failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
          description: Error message.
    User:
      type: object
      properties:
        '@key':
          type: integer
          description: User internal ID.
        name:
          type: string
          description: Username.
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        status:
          type: string
          enum:
          - Active
          - Disabled
        roles:
          type: array
          items:
            type: string
          description: Assigned role names.
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic authentication with Junos Space username and password. Also supports X.509 certificate-based authentication.

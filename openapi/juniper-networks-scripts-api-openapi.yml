openapi: 3.2.0
info:
  title: Juniper Networks Junos Space Network Management Platform REST Scripts API
  description: RESTful API for Junos Space Network Management Platform. Junos Space provides centralized management for Juniper Networks devices including routers, switches, and security appliances. The REST API enables programmatic access to device management, configuration deployment, script execution, and network monitoring. The API uses HTTP Basic or certificate-based authentication and returns XML or JSON responses based on the Accept header. API resources follow HATEOAS principles with discoverable URIs and link relations.
  version: '24.1'
  contact:
    name: Juniper Networks Support
    url: https://www.juniper.net/documentation/product/us/en/junos-space-network-management-platform/
  license:
    name: Proprietary
    url: https://www.juniper.net/us/en/legal-notices.html
servers:
- url: https://{space_server}/api/space
  description: Junos Space Platform API endpoint.
  variables:
    space_server:
      description: Hostname or IP address of the Junos Space server.
      default: space.example.com
security:
- basicAuth: []
tags:
- name: Scripts
  description: Script management and execution on managed devices.
paths:
  /script-management/scripts:
    get:
      operationId: listScripts
      summary: Juniper Networks List scripts
      description: Returns all scripts uploaded to Junos Space. Scripts can be SLAX, XSLT, Python, or commit scripts for execution on managed Junos devices.
      tags:
      - Scripts
      responses:
        '200':
          description: Scripts returned.
          content:
            application/vnd.net.juniper.space.script-management.scripts+json;version=2:
              schema:
                type: object
                properties:
                  scripts:
                    type: object
                    properties:
                      script:
                        type: array
                        items:
                          $ref: '#/components/schemas/Script'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /script-management/scripts/{script_id}/exec-scripts:
    post:
      operationId: executeScript
      summary: Juniper Networks Execute script on devices
      description: Executes a script on one or more managed devices. Returns a job ID for tracking execution status and retrieving results.
      tags:
      - Scripts
      parameters:
      - name: script_id
        in: path
        required: true
        description: Script unique identifier.
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/vnd.net.juniper.space.script-management.exec-scripts+json;version=2:
            schema:
              type: object
              properties:
                exec-scripts:
                  type: object
                  properties:
                    deviceIds:
                      type: array
                      items:
                        type: integer
                      description: Target device IDs.
                    scriptParams:
                      type: object
                      additionalProperties:
                        type: string
                      description: Script parameter values.
      responses:
        '202':
          description: Script execution job initiated.
          content:
            application/vnd.net.juniper.space.job-management.task+json;version=1:
              schema:
                $ref: '#/components/schemas/Job'
components:
  schemas:
    Script:
      type: object
      properties:
        '@key':
          type: integer
          description: Script internal ID.
        scriptName:
          type: string
          description: Script file name.
        description:
          type: string
          description: Script description.
        scriptType:
          type: string
          enum:
          - op
          - commit
          - event
          description: Script type.
        scriptLanguage:
          type: string
          enum:
          - slax
          - xslt
          - python
          description: Script language.
    Error:
      type: object
      properties:
        message:
          type: string
          description: Error message.
    Job:
      type: object
      properties:
        '@key':
          type: integer
          description: Job internal ID.
        jobName:
          type: string
          description: Job name.
        jobType:
          type: string
          description: Job type identifier.
        jobState:
          type: string
          enum:
          - ENABLED
          - INPROGRESS
          - SUCCESS
          - FAILURE
          - CANCELLED
          description: Current job state.
        percent:
          type: number
          description: Completion percentage.
        createdByUserName:
          type: string
          description: User who created the job.
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        summary:
          type: string
          description: Job result summary.
  responses:
    Unauthorized:
      description: Authentication failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic authentication with Junos Space username and password. Also supports X.509 certificate-based authentication.

openapi: 3.2.0
info:
  title: Juniper Networks Juniper vSRX REST System API
  description: RESTful API for managing Juniper vSRX virtual firewall instances. The vSRX provides full next-generation firewall capabilities including stateful inspection, application identification, IPS, content security, and VPN in a virtualized form factor. The REST API runs on the vSRX management plane and provides access to configuration, monitoring, and operational commands. It supports Junos configuration in JSON format and returns structured responses for security policies, zones, NAT rules, and VPN tunnels. Authentication uses HTTP Basic with Junos credentials.
  version: '23.4'
  contact:
    name: Juniper Networks Support
    url: https://www.juniper.net/documentation/product/us/en/vsrx/
  license:
    name: Proprietary
    url: https://www.juniper.net/us/en/legal-notices.html
servers:
- url: https://{vsrx_host}/api
  description: vSRX REST API endpoint.
  variables:
    vsrx_host:
      description: Hostname or IP address of the vSRX instance.
      default: vsrx.example.com
security:
- basicAuth: []
tags:
- name: System
  description: System information and operational commands.
paths:
  /v1/system/information:
    get:
      operationId: getSystemInformation
      summary: Juniper Networks Get system information
      description: Returns system information including hostname, model, Junos version, serial number, and uptime.
      tags:
      - System
      responses:
        '200':
          description: System information returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/system/alarms:
    get:
      operationId: listSystemAlarms
      summary: Juniper Networks List system alarms
      description: Returns active system alarms on the vSRX.
      tags:
      - System
      responses:
        '200':
          description: System alarms returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  alarms:
                    type: array
                    items:
                      $ref: '#/components/schemas/SystemAlarm'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  responses:
    Unauthorized:
      description: Authentication required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    SystemAlarm:
      type: object
      properties:
        id:
          type: integer
          description: Alarm identifier.
        severity:
          type: string
          enum:
          - major
          - minor
          description: Alarm severity.
        description:
          type: string
          description: Alarm description.
        type:
          type: string
          description: Alarm type.
        timestamp:
          type: string
          format: date-time
          description: Alarm trigger time.
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message.
    SystemInfo:
      type: object
      properties:
        hostname:
          type: string
          description: Device hostname.
        model:
          type: string
          description: Device model (e.g., vSRX, vSRX3.0).
        junos_version:
          type: string
          description: Junos OS version.
        serial_number:
          type: string
          description: Virtual serial number.
        uptime:
          type: string
          description: System uptime string.
        last_reboot_reason:
          type: string
          description: Reason for the last reboot.
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic authentication using Junos device credentials. The user must have appropriate class permissions for the requested operations.

openapi: 3.2.0
info:
  title: Juniper Networks Juniper vSRX REST Monitoring API
  description: RESTful API for managing Juniper vSRX virtual firewall instances. The vSRX provides full next-generation firewall capabilities including stateful inspection, application identification, IPS, content security, and VPN in a virtualized form factor. The REST API runs on the vSRX management plane and provides access to configuration, monitoring, and operational commands. It supports Junos configuration in JSON format and returns structured responses for security policies, zones, NAT rules, and VPN tunnels. Authentication uses HTTP Basic with Junos credentials.
  version: '23.4'
  contact:
    name: Juniper Networks Support
    url: https://www.juniper.net/documentation/product/us/en/vsrx/
  license:
    name: Proprietary
    url: https://www.juniper.net/us/en/legal-notices.html
servers:
- url: https://{vsrx_host}/api
  description: vSRX REST API endpoint.
  variables:
    vsrx_host:
      description: Hostname or IP address of the vSRX instance.
      default: vsrx.example.com
security:
- basicAuth: []
tags:
- name: Monitoring
  description: Device and session monitoring operations.
paths:
  /v1/monitoring/security/flow/session:
    get:
      operationId: listFlowSessions
      summary: Juniper Networks List active flow sessions
      description: Returns currently active security flow sessions on the vSRX. Equivalent to the show security flow session CLI command.
      tags:
      - Monitoring
      parameters:
      - name: source_prefix
        in: query
        description: Filter by source IP prefix.
        schema:
          type: string
      - name: destination_prefix
        in: query
        description: Filter by destination IP prefix.
        schema:
          type: string
      - name: application
        in: query
        description: Filter by application name.
        schema:
          type: string
      responses:
        '200':
          description: Flow sessions returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_sessions:
                    type: integer
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/FlowSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  responses:
    Unauthorized:
      description: Authentication required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    FlowSession:
      type: object
      properties:
        session_id:
          type: integer
          description: Session identifier.
        policy:
          type: string
          description: Matching security policy name.
        source_address:
          type: string
          description: Source IP address.
        source_port:
          type: integer
        destination_address:
          type: string
          description: Destination IP address.
        destination_port:
          type: integer
        protocol:
          type: string
          description: IP protocol name.
        application:
          type: string
          description: Identified application.
        in_interface:
          type: string
          description: Ingress interface.
        out_interface:
          type: string
          description: Egress interface.
        bytes_in:
          type: integer
          description: Bytes received.
        bytes_out:
          type: integer
          description: Bytes transmitted.
        duration:
          type: integer
          description: Session duration in seconds.
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message.
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic authentication using Junos device credentials. The user must have appropriate class permissions for the requested operations.

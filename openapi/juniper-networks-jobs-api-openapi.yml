openapi: 3.2.0
info:
  title: Juniper Networks Junos Space Network Management Platform REST Jobs API
  description: RESTful API for Junos Space Network Management Platform. Junos Space provides centralized management for Juniper Networks devices including routers, switches, and security appliances. The REST API enables programmatic access to device management, configuration deployment, script execution, and network monitoring. The API uses HTTP Basic or certificate-based authentication and returns XML or JSON responses based on the Accept header. API resources follow HATEOAS principles with discoverable URIs and link relations.
  version: '24.1'
  contact:
    name: Juniper Networks Support
    url: https://www.juniper.net/documentation/product/us/en/junos-space-network-management-platform/
  license:
    name: Proprietary
    url: https://www.juniper.net/us/en/legal-notices.html
servers:
- url: https://{space_server}/api/space
  description: Junos Space Platform API endpoint.
  variables:
    space_server:
      description: Hostname or IP address of the Junos Space server.
      default: space.example.com
security:
- basicAuth: []
tags:
- name: Jobs
  description: Asynchronous job tracking and management.
paths:
  /job-management/jobs:
    get:
      operationId: listJobs
      summary: Juniper Networks List jobs
      description: Returns all asynchronous jobs with their status. Jobs are created for device discovery, configuration deployment, script execution, and other long-running operations.
      tags:
      - Jobs
      parameters:
      - name: filter
        in: query
        description: Filter expression for job attributes.
        schema:
          type: string
      responses:
        '200':
          description: Jobs returned.
          content:
            application/vnd.net.juniper.space.job-management.jobs+json;version=3:
              schema:
                type: object
                properties:
                  jobs:
                    type: object
                    properties:
                      job:
                        type: array
                        items:
                          $ref: '#/components/schemas/Job'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /job-management/jobs/{job_id}:
    get:
      operationId: getJob
      summary: Juniper Networks Get job status
      description: Returns the status and results of a specific job.
      tags:
      - Jobs
      parameters:
      - name: job_id
        in: path
        required: true
        description: Job unique identifier.
        schema:
          type: integer
      responses:
        '200':
          description: Job returned.
          content:
            application/vnd.net.juniper.space.job-management.job+json;version=3:
              schema:
                $ref: '#/components/schemas/Job'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
          description: Error message.
    Job:
      type: object
      properties:
        '@key':
          type: integer
          description: Job internal ID.
        jobName:
          type: string
          description: Job name.
        jobType:
          type: string
          description: Job type identifier.
        jobState:
          type: string
          enum:
          - ENABLED
          - INPROGRESS
          - SUCCESS
          - FAILURE
          - CANCELLED
          description: Current job state.
        percent:
          type: number
          description: Completion percentage.
        createdByUserName:
          type: string
          description: User who created the job.
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        summary:
          type: string
          description: Job result summary.
  responses:
    Unauthorized:
      description: Authentication failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic authentication with Junos Space username and password. Also supports X.509 certificate-based authentication.

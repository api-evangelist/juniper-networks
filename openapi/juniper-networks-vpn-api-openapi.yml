openapi: 3.2.0
info:
  title: Juniper Networks Juniper vSRX REST VPN API
  description: RESTful API for managing Juniper vSRX virtual firewall instances. The vSRX provides full next-generation firewall capabilities including stateful inspection, application identification, IPS, content security, and VPN in a virtualized form factor. The REST API runs on the vSRX management plane and provides access to configuration, monitoring, and operational commands. It supports Junos configuration in JSON format and returns structured responses for security policies, zones, NAT rules, and VPN tunnels. Authentication uses HTTP Basic with Junos credentials.
  version: '23.4'
  contact:
    name: Juniper Networks Support
    url: https://www.juniper.net/documentation/product/us/en/vsrx/
  license:
    name: Proprietary
    url: https://www.juniper.net/us/en/legal-notices.html
servers:
- url: https://{vsrx_host}/api
  description: vSRX REST API endpoint.
  variables:
    vsrx_host:
      description: Hostname or IP address of the vSRX instance.
      default: vsrx.example.com
security:
- basicAuth: []
tags:
- name: VPN
  description: IPsec VPN tunnel configuration.
paths:
  /v1/security/ipsec/vpn:
    get:
      operationId: listIpsecVpns
      summary: Juniper Networks List IPsec VPN tunnels
      description: Returns all IPsec VPN tunnel configurations, including IKE gateway associations, encryption settings, and tunnel status.
      tags:
      - VPN
      responses:
        '200':
          description: IPsec VPN tunnels returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ipsec-vpns:
                    type: array
                    items:
                      $ref: '#/components/schemas/IpsecVpn'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  responses:
    Unauthorized:
      description: Authentication required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message.
    IpsecVpn:
      type: object
      properties:
        name:
          type: string
          description: VPN tunnel name.
        ike_gateway:
          type: string
          description: IKE gateway name.
        ike_policy:
          type: string
          description: IKE policy name.
        ipsec_policy:
          type: string
          description: IPsec policy name.
        bind_interface:
          type: string
          description: Tunnel interface (e.g., st0.0).
        establish_tunnels:
          type: string
          enum:
          - immediately
          - on-traffic
          description: Tunnel establishment trigger.
        status:
          type: string
          enum:
          - up
          - down
          description: Current tunnel status.
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: HTTP Basic authentication using Junos device credentials. The user must have appropriate class permissions for the requested operations.
